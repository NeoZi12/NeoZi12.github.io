<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#0d0208"/>
  <text
    x="50"
    y="72"
    text-anchor="middle"
    font-family="Courier New, monospace"
    font-weight="700"
    font-size="46"
    fill="#00ff41"
    filter="url(#glow)"
  >NZ</text>
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
